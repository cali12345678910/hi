<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الأحاديث</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Cairo','Amiri',serif}
  .amiri{font-family:'Amiri',serif}
  .card{transition:transform .2s ease}
  .card:hover{transform:translateY(-2px)}
  .toast{transition:opacity .3s}
</style>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white min-h-screen">
  <header class="sticky top-0 z-20 bg-white/90 dark:bg-black/90 backdrop-blur border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <h1 class="text-xl font-bold">مكتبة الأحاديث</h1>
      <div class="flex items-center gap-2 flex-1 justify-end">
        <input id="search" type="text" placeholder="بحث..." class="w-full max-w-xs px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-1 focus:ring-black dark:focus:ring-white" />
        <button id="themeToggle" class="p-2 rounded-lg border border-gray-300 dark:border-gray-700" aria-label="theme">◐</button>
      </div>
    </div>
  </header>

  <nav class="max-w-3xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto">
    <button data-cat="all" class="catBtn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-black text-white dark:bg-white dark:text-black">الكل</button>
    <button data-cat="hisn" class="catBtn px-4 py-2 rounded-full text-sm whitespace-nowrap border border-gray-300 dark:border-gray-700">حصن المسلم</button>
    <button data-cat="morning" class="catBtn px-4 py-2 rounded-full text-sm whitespace-nowrap border border-gray-300 dark:border-gray-700">أذكار الصباح والمساء</button>
    <button data-cat="nawawi" class="catBtn px-4 py-2 rounded-full text-sm whitespace-nowrap border border-gray-300 dark:border-gray-700">الأربعين النووية</button>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-4">
    <div id="list" class="space-y-4"></div>
    <div id="empty" class="hidden text-center text-gray-500 py-12">لا توجد نتائج</div>
  </main>

  <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white dark:bg-white dark:text-black px-4 py-2 rounded-lg text-sm opacity-0 pointer-events-none">تم النسخ</div>

<script>
const DATA = [
  {id:1,cat:'hisn',title:'دعاء الاستيقاظ من النوم',text:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',ref:'رواه البخاري [صحيح]'},
  {id:2,cat:'hisn',title:'دعاء لبس الثوب',text:'الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ',ref:'رواه أبو داود والترمذي [حسن]'},
  {id:3,cat:'morning',title:'أذكار الصباح',text:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',ref:'رواه مسلم [صحيح]'},
  {id:4,cat:'morning',title:'سيد الاستغفار',text:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',ref:'رواه البخاري [صحيح]'},
  {id:5,cat:'morning',title:'أذكار المساء',text:'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ',ref:'رواه مسلم [صحيح]'},
  {id:6,cat:'hisn',title:'دعاء دخول المنزل',text:'بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا',ref:'رواه أبو داود [حسن]'},
  {id:7,cat:'hisn',title:'دعاء الخروج من المنزل',text:'بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',ref:'رواه أبو داود والترمذي [صحيح]'},
  {id:8,cat:'hisn',title:'دعاء دخول المسجد',text:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',ref:'رواه مسلم [صحيح]'},
  {id:9,cat:'hisn',title:'دعاء الخروج من المسجد',text:'اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ',ref:'رواه مسلم [صحيح]'},
  {id:10,cat:'nawawi',title:'الحديث الأول (النيات)',text:'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ',ref:'رواه البخاري ومسلم [متفق عليه]'},
  {id:11,cat:'nawawi',title:'الحديث الثاني (الإسلام والإيمان)',text:'بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَالْحَجِّ، وَصَوْمِ رَمَضَانَ',ref:'رواه البخاري ومسلم [متفق عليه]'},
  {id:12,cat:'nawawi',title:'الحديث الثالث (أركان الإسلام)',text:'الإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا',ref:'رواه مسلم [صحيح]'},
  {id:13,cat:'hisn',title:'دعاء بعد التشهد',text:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ',ref:'رواه البخاري ومسلم [متفق عليه]'},
  {id:14,cat:'hisn',title:'دعاء الاستخارة',text:'اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ',ref:'رواه البخاري [صحيح]'},
  {id:15,cat:'hisn',title:'دعاء السفر',text:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ',ref:'رواه مسلم [صحيح]'},
];

const favs = new Set(JSON.parse(localStorage.getItem('hadith_favs')||'[]'));
let cat='all';
let q='';

const dark = localStorage.getItem('hadith_theme')==='dark';
if(dark) document.documentElement.classList.add('dark');

function saveFavs(){localStorage.setItem('hadith_favs',JSON.stringify([...favs]));}

function filtered(){
  return DATA.filter(d=>{
    if(cat!=='all' && d.cat!==cat) return false;
    if(q){const t=(d.title+d.text+d.ref).toLowerCase(); if(!t.includes(q.toLowerCase())) return false;}
    return true;
  });
}

function escape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const list=document.getElementById('list');
  const items=filtered();
  document.getElementById('empty').classList.toggle('hidden', items.length>0);
  list.innerHTML=items.map(d=>`
    <article class="card border border-gray-200 dark:border-gray-800 rounded-2xl p-5">
      <h2 class="text-base font-semibold mb-3">${escape(d.title)}</h2>
      <p class="amiri text-xl leading-loose text-right" dir="rtl">${escape(d.text)}</p>
      <div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-800 flex items-center justify-between gap-2">
        <span class="text-xs text-gray-500">${escape(d.ref)}</span>
        <div class="flex gap-3 text-gray-600 dark:text-gray-400">
          <button data-copy="${d.id}" title="نسخ" class="hover:text-black dark:hover:text-white">📋</button>
          <button data-share="${d.id}" title="مشاركة" class="hover:text-black dark:hover:text-white">↗</button>
          <button data-fav="${d.id}" title="مفضلة" class="hover:text-black dark:hover:text-white ${favs.has(d.id)?'text-red-500':''}">${favs.has(d.id)?'♥':'♡'}</button>
        </div>
      </div>
    </article>
  `).join('');
  list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    const d=DATA.find(x=>x.id==b.dataset.copy);
    navigator.clipboard.writeText(d.text).then(()=>{const t=document.getElementById('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1500);});
  });
  list.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.fav; if(favs.has(id)) favs.delete(id); else favs.add(id); saveFavs(); render();
  });
  list.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{
    const d=DATA.find(x=>x.id==b.dataset.share);
    if(navigator.share) navigator.share({text:d.text}); else {navigator.clipboard.writeText(d.text);const t=document.getElementById('toast');t.textContent='تم نسخ النص';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1500);}
  });
}

document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render();});
document.querySelectorAll('.catBtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.catBtn').forEach(x=>{x.classList.remove('bg-black','text-white','dark:bg-white','dark:text-black');x.classList.add('border','border-gray-300','dark:border-gray-700');});
  b.classList.add('bg-black','text-white','dark:bg-white','dark:text-black'); b.classList.remove('border','border-gray-300','dark:border-gray-700');
  cat=b.dataset.cat; render();
});
document.getElementById('themeToggle').onclick=()=>{
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('hadith_theme', document.documentElement.classList.contains('dark')?'dark':'light');
};

render();
</script>
</body>
</html>
