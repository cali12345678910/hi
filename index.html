<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraPad</title>
<style>
:root{
  --bg:#000000;
  --panel:rgba(25,25,25,0.6);
  --panel-border:1px solid rgba(255,255,255,0.12);
  --white:#ffffff;
  --text:#ffffff;
  --text-dim:rgba(255,255,255,0.55);
  --text-muted:rgba(255,255,255,0.3);
  --shadow:0 30px 80px rgba(0,0,0,0.7);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#aurora{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:block;
  z-index:0;
  touch-action:none;
}
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  z-index:50;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:var(--panel-border);
  background:rgba(0,0,0,0.5);
}
.app-title{
  font-size:12px;
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text);
  opacity:0.6;
  letter-spacing:4px;
}
.workspace{
  position:relative;
  z-index:20;
  padding:64px 48px 60px;
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:340px 1fr;
  gap:40px;
  align-items:start;
}
@media (max-width:900px){
  .workspace{
    grid-template-columns:1fr;
    padding-top:88px;
    padding-left:24px;
    padding-right:24px;
    gap:32px;
  }
}
.panel{
  background:var(--panel);
  border:var(--panel-border);
  border-radius:2px;
  padding:40px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.panel h2{
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:4px;
  color:var(--text-muted);
  margin-bottom:32px;
  display:flex;
  align-items:center;
  gap:10px;
}
.panel h2 svg{
  width:11px;
  height:11px;
  color:var(--text);
  opacity:0.4;
}

/* ---------- Sound Mixer ---------- */
.mixer-list{
  display:flex;
  flex-direction:column;
  gap:22px;
}
.mixer-item{
  display:flex;
  align-items:center;
  gap:14px;
}
.mixer-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--white);
  opacity:0.4;
  flex-shrink:0;
  box-shadow:0 0 8px rgba(255,255,255,0.3);
}
.mixer-dot.on{
  opacity:1;
}
.mixer-label{
  flex:1;
  font-size:12px;
  font-weight:500;
  color:var(--text);
  opacity:0.8;
}
.mixer-slider{
  width:100px;
  height:1px;
  background:rgba(255,255,255,0.1);
  border-radius:0;
  outline:none;
  appearance:none;
}
.mixer-slider::-webkit-slider-thumb{
  appearance:none;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
}
.mixer-val{
  font-size:10px;
  color:var(--text-muted);
  min-width:28px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

/* ---------- Pomodoro ---------- */
.timer-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.time{
  font-size:88px;
  font-weight:400;
  letter-spacing:-8px;
  font-variant-numeric:tabular-nums;
  color:#fff;
  line-height:1;
}
.mode-chip{
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:3px;
  padding:8px 18px;
  border-radius:2px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.03);
  color:var(--white);
}
.timer-controls{
  display:flex;
  gap:10px;
  margin-top:6px;
}
.mode-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.btn{
  border:none;
  border-radius:2px;
  padding:10px 18px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s ease;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  color:var(--white);
  flex:1;
}
.btn:hover{
  background:rgba(255,255,255,0.1);
}
.btn.primary{
  background:#fff;
  color:#000;
  border-color:transparent;
}
.btn.secondary{
  background:transparent;
}
.status{
  font-size:10px;
  color:var(--text-muted);
  margin-top:12px;
  min-height:12px;
}

/* ---------- Scratchpad ---------- */
.notes textarea{
  width:100%;
  height:180px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:2px;
  color:var(--white);
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  font-size:13px;
  line-height:1.8;
  resize:none;
  outline:none;
  padding:16px;
  touch-action:auto;
}
.notes textarea::placeholder{
  color:rgba(255,255,255,0.25);
}
.notes-status{
  font-size:10px;
  color:var(--text-muted);
  margin-top:12px;
  min-height:12px;
}
</style>
</head>
<body>
<canvas id="aurora"></canvas>
<header>
  <div class="app-title">AuraPad</div>
</header>
<div class="workspace" id="workspace">
  <div class="panel" id="panelMixer">
    <h2><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Sound Mixer</h2>
    <div class="mixer-list">
      <div class="mixer-item">
        <div class="mixer-dot" id="dotHum"></div>
        <div class="mixer-label">Deep Synth Hum</div>
        <input type="range" min="0" max="1" step="0.01" value="0.45" class="mixer-slider" id="volHum">
        <span class="mixer-val" id="valHum">45%</span>
      </div>
      <div class="mixer-item">
        <div class="mixer-dot" id="dotRain"></div>
        <div class="mixer-label">Soft Rain</div>
        <input type="range" min="0" max="1" step="0.01" value="0.4" class="mixer-slider" id="volRain">
        <span class="mixer-val" id="valRain">40%</span>
      </div>
      <div class="mixer-item">
        <div class="mixer-dot" id="dotCrackle"></div>
        <div class="mixer-label">Vinyl Crackle</div>
        <input type="range" min="0" max="1" step="0.01" value="0.3" class="mixer-slider" id="volCrackle">
        <span class="mixer-val" id="valCrackle">30%</span>
      </div>
      <div class="mixer-item">
        <div class="mixer-dot" id="dotChimes"></div>
        <div class="mixer-label">Cosmic Chimes</div>
        <input type="range" min="0" max="1" step="0.01" value="0.35" class="mixer-slider" id="volChimes">
        <span class="mixer-val" id="valChimes">35%</span>
      </div>
      <div class="mixer-item" style="padding-top:12px">
        <div class="mixer-label" style="font-size:10px;color:var(--text-muted)">Master Volume</div>
        <input type="range" min="0" max="1" step="0.01" value="0.7" class="mixer-slider" id="volMaster">
        <span class="mixer-val" id="valMaster">70%</span>
      </div>
    </div>
  </div>
  <div class="focus-col">
    <div class="panel" id="panelPomodoro">
      <h2><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Pomodoro</h2>
      <div class="timer-wrap">
        <div class="time" id="timer">25:00</div>
        <div class="mode-chip" id="modeChip">Work</div>
      </div>
      <div class="timer-controls">
        <button class="btn primary" id="timerStart">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button class="btn" id="timerReset">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v16a2 2 0 0 0 2 2h16"></path><polyline points="8 4 4 8 8 12"></polyline><polyline points="16 20 20 16 16 12"></polyline></svg>
        </button>
      </div>
      <div class="mode-row">
        <button class="btn" id="modeWork">Work</button>
        <button class="btn" id="modeBreak">Break</button>
      </div>
      <div class="status" id="timerStatus"></div>
    </div>
    <div class="panel notes" id="panelNotes">
      <h2><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Scratchpad</h2>
      <textarea id="notes" placeholder="Type notes…"></textarea>
      <div class="notes-status" id="notesStatus">Saved locally</div>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('aurora');
  const ctx = canvas.getContext('2d', { alpha: false });
  const $ = id => document.getElementById(id);

  // ---------------- Audio engine (muffled, smooth, relaxing) ----------------
  let audioCtx = null;
  let masterGain = null;
  let analyser = null;
  let audioStarted = false;
  const channels = {};

  function startAudio(){
    if(audioStarted) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;
    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioStarted = true;
    initHum();
    initRain();
    initCrackle();
    initChimes();
  }

  function setChannel(name, on){
    const ch = channels[name];
    if(!ch) return;
    ch.on = on;
    if(ch.gain){
      ch.gain.gain.cancelScheduledValues(0);
      ch.gain.gain.setValueAtTime(on ? ch.vol : 0, audioCtx.currentTime);
    }
    const dot = $(`dot${name.charAt(0).toUpperCase() + name.slice(1)}`);
    if(dot) dot.classList.toggle('on', on);
  }

  function setChannelVol(name, vol){
    const ch = channels[name];
    if(!ch) return;
    ch.vol = Math.max(0, Math.min(1, vol));
    if(ch.on && ch.gain) ch.gain.gain.value = ch.vol;
  }

  function setMaster(vol){
    if(masterGain) masterGain.gain.value = Math.max(0, Math.min(1, vol));
  }

  // Deep Synth Hum: warm low-pass filtered sub-bass
  function initHum(){
    const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 120; filter.Q.value = 0.5;
    const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 41.2;
    const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 41.4;
    const o3 = audioCtx.createOscillator(); o3.type = 'sine'; o3.frequency.value = 82.4;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.03;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.5;
    lfo.connect(lfoG); lfoG.connect(o1.detune);
    [o1,o2,o3,lfo].forEach(o=>o.start());
    o1.connect(filter); o2.connect(filter); o3.connect(filter);
    filter.connect(g);
    channels.hum = { gain:g, on:false, vol:0.45 };
  }

  // Soft Rain: muffled pink noise with heavy low-pass
  function initRain(){
    const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 400; filter.Q.value = 0.8;
    const buf = makePinkNoiseBuffer(audioCtx.sampleRate, 24);
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    src.connect(filter); filter.connect(g);
    src.start();
    channels.rain = { gain:g, on:false, vol:0.4 };
  }

  // Vinyl Crackle: very subtle hum with rare soft pops
  function initCrackle(){
    const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 700; filter.Q.value = 1.2;
    const buf = makeNoiseBuffer(audioCtx.sampleRate, 30, 'crackle');
    const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    src.connect(filter); filter.connect(g);
    src.start();
    channels.crackle = { gain:g, on:false, vol:0.25 };
  }

  // Cosmic Chimes: soft gentle tones at long intervals with reverb
  function initChimes(){
    const g = audioCtx.createGain(); g.gain.value = 0; g.connect(masterGain);
    const convolver = audioCtx.createConvolver();
    convolver.buffer = makeReverbBuffer(audioCtx.sampleRate, 2.8);
    convolver.connect(g);
    channels.chimes = { gain:g, on:false, vol:0.3, convolver };
    scheduleChime();
  }

  function scheduleChime(){
    setTimeout(()=>{
      if(!audioCtx || !channels.chimes.on){ scheduleChime(); return; }
      const now = audioCtx.currentTime;
      const PENTATONIC = [220,246.94,293.66,329.63,392,440,523.25];
      const freq = PENTATONIC[Math.floor(Math.random()*PENTATONIC.length)] * Math.pow(2, Math.floor(Math.random()*2));
      const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value = freq;
      const env = audioCtx.createGain();
      env.gain.setValueAtTime(0, now);
      env.gain.linearRampToValueAtTime(0.14, now + 0.15);
      env.gain.exponentialRampToValueAtTime(0.0005, now + 4);
      osc.connect(env); env.connect(channels.chimes.convolver);
      osc.start(now); osc.stop(now + 4.2);
      scheduleChime();
    }, 6000 + Math.random()*8000);
  }

  function makeReverbBuffer(sampleRate, duration){
    const len = sampleRate * duration;
    const buf = audioCtx.createBuffer(2, len, sampleRate);
    for(let ch=0;ch<2;ch++){
      const data = buf.getChannelData(ch);
      for(let i=0;i<len;i++){
        const t = i/sampleRate;
        data[i] = (Math.random()*2-1) * Math.exp(-t * 2.6);
      }
    }
    return buf;
  }

  function makePinkNoiseBuffer(sampleRate, duration){
    const len = sampleRate * duration;
    const buf = audioCtx.createBuffer(1, len, sampleRate);
    const data = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){
      const white = Math.random()*2-1;
      b0 = 0.99886*b0 + white*0.0555179;
      b1 = 0.99332*b1 + white*0.0750759;
      b2 = 0.96900*b2 + white*0.1538520;
      b3 = 0.86650*b3 + white*0.3104856;
      b4 = 0.55000*b4 + white*0.5329522;
      b5 = -0.7616*b5 - white*0.0168980;
      b6 = white*0.115926;
      data[i] = white + b0 + b1 + b2 + b3 + b4 + b5 + b6 + white*0.5362;
      data[i] *= 0.1;
    }
    return buf;
  }

  function makeNoiseBuffer(sampleRate, duration, kind){
    const len = sampleRate * duration;
    const buf = audioCtx.createBuffer(1, len, sampleRate);
    const data = buf.getChannelData(0);
    let brown=0;
    let nextPop = 2000 + Math.random()*4000;
    for(let i=0;i<len;i++){
      const white = Math.random()*2-1;
      brown += white*0.01;
      brown *= 0.997;
      let sample = brown*0.5;
      if(kind==='crackle' && i>=nextPop){
        const amp = 0.08 + Math.random()*0.12;
        const span = 15 + Math.random()*60;
        for(let j=0;j<span && i+j<len;j++){
          data[i+j] += amp * Math.exp(-j/24) * (Math.random()*2-1) * 0.25;
        }
        nextPop += 3000 + Math.random()*8000;
      }
      data[i] = sample;
    }
    for(let i=0;i<len;i++){
      let v=data[i]; v = v>1?1:v<-1?-1:v; data[i]=v;
    }
    return buf;
  }

  function playAlert(){
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const seq = [523.25, 659.25, 783.99, 1046.50];
    seq.forEach((f,i)=>{
      const t = now + i*0.16;
      const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t+0.08);
      g.gain.exponentialRampToValueAtTime(0.0005, t+0.6);
      osc.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t+0.7);
    });
  }

  function getBassEnergy(){
    if(!analyser) return 0;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    let sum=0;
    const n = Math.min(64, data.length);
    for(let i=0;i<n;i++) sum += data[i];
    return sum/n/255;
  }

  // ---------------- Canvas: monochrome smoke wave ----------------
  let width=0, height=0, dpr=1;

  function resize(){
    width = innerWidth;
    height = innerHeight;
    dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = width*dpr;
    canvas.height = height*dpr;
    canvas.style.width = width+'px';
    canvas.style.height = height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const layers = [
    { baseY:0.45, amp:40, freq:0.0005, spd:0.00002, color:200, noiseAmp:3 },
    { baseY:0.55, amp:50, freq:0.0004, spd:-0.000015, color:160, noiseAmp:4 },
    { baseY:0.62, amp:35, freq:0.0006, spd:0.000025, color:220, noiseAmp:2 },
  ];

  function drawAurora(t){
    const bass = getBassEnergy();
    const grad = ctx.createLinearGradient(0,0,0,height);
    grad.addColorStop(0, '#000000');
    grad.addColorStop(1, '#050505');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width,height);

    for(const l of layers){
      const pts = [];
      const steps = Math.ceil(width/6);
      for(let i=0;i<=steps;i++){
        const x = (width/steps)*i;
        let y = height*l.baseY;
        y += Math.sin(x*l.freq + t*l.spd*400) * l.amp;
        y += Math.sin(x*l.freq*2.2 + t*l.spd*200) * l.amp*0.25;
        y += Math.sin(x*l.freq*0.25 + t*0.0003) * l.noiseAmp;
        pts.push([x,y]);
      }
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.closePath();
      const a = 0.025 + bass*0.02;
      ctx.fillStyle = `rgba(${l.color},${l.color},${l.color},${a})`;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.strokeStyle = `rgba(${l.color},${l.color},${l.color},${0.05 + bass*0.04})`;
      ctx.lineWidth = 1;
      ctx.shadowBlur = 6 + bass*10;
      ctx.shadowColor = `rgb(${l.color},${l.color},${l.color})`;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // ---------------- Pomodoro ----------------
  let pomodoro = { work:25*60, break:5*60, left:25*60, mode:'work', running:false, last:0 };

  function fmt(s){
    const m = Math.floor(s/60);
    const sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }
  function timerRender(){
    $('timer').textContent = fmt(pomodoro.left);
    $('modeChip').textContent = pomodoro.mode.charAt(0).toUpperCase() + pomodoro.mode.slice(1);
  }
  function timerSetMode(mode){
    pomodoro.mode = mode;
    pomodoro.left = mode==='work' ? pomodoro.work : pomodoro.break;
    pomodoro.running = false;
    $('timerStart').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
    timerRender();
    $('timerStatus').textContent = '';
  }
  function timerStartStop(){
    startAudio();
    pomodoro.running = !pomodoro.running;
    pomodoro.last = performance.now();
    const btn = $('timerStart');
    if(pomodoro.running){
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';
    } else {
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
    }
  }
  function timerReset(){
    pomodoro.running = false;
    pomodoro.left = pomodoro.mode==='work' ? pomodoro.work : pomodoro.break;
    $('timerStart').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
    timerRender();
    $('timerStatus').textContent = '';
  }
  function timerTick(now){
    if(!pomodoro.running) return;
    const elapsed = (now - pomodoro.last)/1000;
    if(elapsed < 1) return;
    const steps = Math.floor(elapsed);
    pomodoro.last += steps*1000;
    pomodoro.left -= steps;
    if(pomodoro.left <= 0){
      pomodoro.left = 0;
      pomodoro.running = false;
      playAlert();
      $('timerStatus').textContent = 'Session complete';
      $('timerStart').innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
      timerRender();
      return;
    }
    timerRender();
  }

  $('timerStart').addEventListener('click', timerStartStop);
  $('timerReset').addEventListener('click', timerReset);
  $('modeWork').addEventListener('click', ()=>timerSetMode('work'));
  $('modeBreak').addEventListener('click', ()=>timerSetMode('break'));
  timerRender();

  // ---------------- Notes ----------------
  const notesEl = $('notes');
  const notesStatus = $('notesStatus');
  let notesDebounce = null;
  notesEl.value = localStorage.getItem('aurora_notes') || '';
  notesStatus.textContent = notesEl.value ? 'Saved locally' : 'Empty';
  function saveNotes(){
    localStorage.setItem('aurora_notes', notesEl.value);
    notesStatus.textContent = 'Saved';
    setTimeout(()=>{ notesStatus.textContent = ''; }, 1500);
  }
  notesEl.addEventListener('input', ()=>{
    if(notesDebounce) clearTimeout(notesDebounce);
    notesDebounce = setTimeout(saveNotes, 300);
  });

  // ---------------- Mixer wiring ----------------
  const mixerDefs = [
    { name:'hum', tog:'dotHum', vol:'volHum', val:'valHum' },
    { name:'rain', tog:'dotRain', vol:'volRain', val:'valRain' },
    { name:'crackle', tog:'dotCrackle', vol:'volCrackle', val:'valCrackle' },
    { name:'chimes', tog:'dotChimes', vol:'volChimes', val:'valChimes' },
  ];
  mixerDefs.forEach(d=>{
    const togEl = $(d.tog);
    const volEl = $(d.vol);
    const valEl = $(d.val);
    togEl.addEventListener('click', ()=>{
      startAudio();
      const on = !togEl.classList.contains('on');
      togEl.classList.toggle('on', on);
      setChannel(d.name, on);
    });
    volEl.addEventListener('input', ()=>{
      const v = parseFloat(volEl.value);
      valEl.textContent = Math.round(v*100) + '%';
      setChannelVol(d.name, v);
    });
    volEl.dispatchEvent(new Event('input'));
  });

  const masterEl = $('volMaster');
  const masterVal = $('valMaster');
  masterEl.addEventListener('input', ()=>{
    const v = parseFloat(masterEl.value);
    masterVal.textContent = Math.round(v*100) + '%';
    setMaster(v);
  });
  masterEl.dispatchEvent(new Event('input'));

  window.addEventListener('pointerdown', startAudio, {once:true});
  window.addEventListener('touchstart', startAudio, {once:true});
  window.addEventListener('keydown', startAudio, {once:true});

  // ---------------- Render loop ----------------
  let lastT = 0;
  function loop(t){
    const dt = Math.min(0.033, (t-lastT)/1000);
    lastT = t;
    drawAurora(t);
    timerTick(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
