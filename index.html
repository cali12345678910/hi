<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Runner — Aurora</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#090a0f;color:#eaeaf0;font-family:'Inter',system-ui,sans-serif}
  canvas{display:block}
  .hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
  .hud .score{font-size:32px;font-weight:800;letter-spacing:-1px;text-shadow:0 0 20px rgba(91,108,255,.6)}
  .hud .best{font-size:12px;opacity:.6;margin-top:2px}
  .panel{position:fixed;top:16px;right:16px;z-index:6;background:rgba(12,14,24,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;width:220px}
  .panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;margin-bottom:8px}
  .panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .panel button{flex:1;min-width:60px;padding:8px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#eaeaf0;font-size:12px;cursor:pointer;transition:.2s}
  .panel button.active{background:linear-gradient(135deg,#5b6cff,#ff5b9a);border-color:transparent}
  .panel button:hover:not(.active){background:rgba(255,255,255,.1)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:7;background:rgba(9,10,15,.55);backdrop-filter:blur(6px)}
  .overlay h1{font-size:56px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#fff,#5b6cff 60%,#5bffcf);-webkit-background-clip:text;background-clip:text;color:transparent}
  .overlay p{margin-top:12px;opacity:.7;font-size:16px}
  .overlay .btn{margin-top:28px;padding:14px 40px;border-radius:999px;border:none;background:#fff;color:#0a0a0f;font-weight:700;font-size:15px;cursor:pointer}
  .overlay .btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(91,108,255,.4)}
  .hidden{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="score" id="score">0</div>
  <div class="best" id="best">best 0</div>
</div>
<div class="panel">
  <h3>Icon</h3>
  <div class="row" id="icons">
    <button data-v="tri" class="active">Triangle</button>
    <button data-v="dia">Diamond</button>
    <button data-v="dot">Dot</button>
  </div>
  <h3>Theme</h3>
  <div class="row" id="themes">
    <button data-v="aurora" class="active">Aurora</button>
    <button data-v="violet">Violet</button>
    <button data-v="solar">Solar</button>
    <button data-v="polar">Polar</button>
  </div>
  <h3>Trail</h3>
  <div class="row" id="trails">
    <button data-v="solid" class="active">Solid</button>
    <button data-v="particle">Particle</button>
    <button data-v="fade">Fade</button>
  </div>
</div>
<div class="overlay" id="start">
  <h1>Wave Runner</h1>
  <p>Hold Space / click / tap to rise · Release to fall</p>
  <button class="btn" id="play">Play</button>
</div>
<div class="overlay hidden" id="over">
  <h1>Crashed</h1>
  <p id="finalscore">0</p>
  <button class="btn" id="retry">Retry</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){ canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr; canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);}
  resize(); addEventListener('resize', resize);

  const THEMES = {
    aurora: { player:'#5bffcf', trail1:'#5b6cff', trail2:'#ff5b9a', wall:'#5b6cff', spike:'#ff5b9a', glow:'rgba(91,108,255,.35)' },
    violet: { player:'#c084fc', trail1:'#a855f7', trail2:'#ec4899', wall:'#a855f7', spike:'#ec4899', glow:'rgba(168,85,247,.35)' },
    solar:  { player:'#fbbf24', trail1:'#f59e0b', trail2:'#ef4444', wall:'#f59e0b', spike:'#ef4444', glow:'rgba(245,158,11,.35)' },
    polar:  { player:'#e2e8f0', trail1:'#94a3b8', trail2:'#cbd5e1', wall:'#94a3b8', spike:'#cbd5e1', glow:'rgba(148,163,184,.35)' }
  };
  let theme = 'aurora', icon = 'tri', trail = 'solid';
  let state = 'menu', score = 0, best = +localStorage.getItem('wr_best')||0, speed = 360, dist = 0;
  let holding = false, player = {x:0,y:0,vy:0}, trailPts = [], particles = [];
  let walls = [], spikes = []; // world-space x
  let lastT = 0, spawnX = 0;
  const W = () => innerWidth, H = () => innerHeight;
  const GROUND_Y = () => H()*0.85, CEIL_Y = () => H()*0.15;

  function reset(){
    score = 0; dist = 0; speed = 360;
    player.x = W()*0.22; player.y = H()*0.5; player.vy = 0;
    trailPts = []; particles = []; walls = []; spikes = []; spawnX = player.x + 200;
    holding = false;
    document.getElementById('score').textContent = '0';
  }

  // procedural generation: maintain walls ahead of player
  function ensureWorld(){
    const ahead = player.x + W()*1.5;
    while (spawnX < ahead){
      // corridor segment
      const segW = 100 + Math.random()*60;
      const baseTop = CEIL_Y() + 20 + Math.random()*40;
      const baseBot = GROUND_Y() - 20 - Math.random()*40;
      const slopeTop = (Math.random()-0.5)*0.9;
      const slopeBot = (Math.random()-0.5)*0.9;
      walls.push({x:spawnX, w:segW, top0:baseTop, slopeTop, bot0:baseBot, slopeBot});
      // maybe spike
      if (Math.random() < 0.6){
        const sx = spawnX + segW*0.4;
        const sy = baseBot - 18;
        spikes.push({x:sx,y:sy,w:26,h:26,side:'bottom'});
      }
      if (Math.random() < 0.5){
        const sx = spawnX + segW*0.65;
        const sy = baseTop + 18;
        spikes.push({x:sx,y:sy,w:26,h:26,side:'top'});
      }
      if (Math.random() < 0.35){
        spikes.push({x:spawnX+segW*0.5, y:(baseTop+baseBot)/2, w:20, h:20, side:'mid'});
      }
      spawnX += segW;
    }
    // remove old
    walls = walls.filter(w => w.x + w.w > player.x - 200);
    spikes = spikes.filter(s => s.x + s.w > player.x - 200);
  }

  function wallY(w, x, top){
    const t = x - w.x;
    return top ? w.top0 + w.slopeTop*t : w.bot0 + w.slopeBot*t;
  }

  function update(dt){
    if(state!=='play') return;
    // input -> vy
    const s = speed * dpr; // px/sec (screen px)
    player.vy = holding ? -speed : speed;
    player.x += speed*dt;
    player.y += player.vy*dt;
    dist += speed*dt;
    score = Math.floor(dist/10);
    document.getElementById('score').textContent = score;
    if(score>best){ best=score; localStorage.setItem('wr_best',best); document.getElementById('best').textContent='best '+best;}

    // difficulty
    speed = 360 + Math.min(400, score*1.2);

    ensureWorld();

    // trail
    trailPts.unshift({x:player.x, y:player.y});
    if(trailPts.length>40) trailPts.pop();

    // particles
    if(trail==='particle' && Math.random()<0.6){
      particles.push({x:player.x,y:player.y,vx:-speed*0.3,vy:(Math.random()-0.5)*40,life:1,r:2+Math.random()*2});
    }
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.8;});
    particles = particles.filter(p=>p.life>0);

    // collision
    // bounds
    const top = getTop(player.x), bot = getBot(player.x);
    if(player.y < top+12 || player.y > bot-12){ crash(); return; }
    for(const s of spikes){
      if(player.x+10 > s.x && player.x-10 < s.x+s.w && player.y+10 > s.y-s.h && player.y-10 < s.y+s.h){ crash(); return; }
    }
  }

  function getTop(x){
    for(const w of walls){ if(x>=w.x && x<=w.x+w.w) return wallY(w,x,true); }
    return CEIL_Y();
  }
  function getBot(x){
    for(const w of walls){ if(x>=w.x && x<=w.x+w.w) return wallY(w,x,false); }
    return GROUND_Y();
  }

  function crash(){
    state='over';
    document.getElementById('finalscore').textContent = score;
    document.getElementById('over').classList.remove('hidden');
  }

  function drawAurora(t){
    const g = ctx.createLinearGradient(0,0,0,H());
    g.addColorStop(0,'#090a0f'); g.addColorStop(1,'#121826');
    ctx.fillStyle = g; ctx.fillRect(0,0,W(),H());
    // aurora waves
    const layers = [
      {color:'rgba(91,108,255,0.18)', amp:60, freq:0.003, speed:0.0003, y:0.35},
      {color:'rgba(255,91,154,0.14)', amp:80, freq:0.0025, speed:-0.0002, y:0.5},
      {color:'rgba(91,255,207,0.12)', amp:50, freq:0.004, speed:0.0004, y:0.65},
      {color:'rgba(168,85,247,0.12)', amp:70, freq:0.002, speed:-0.00025, y:0.45}
    ];
    layers.forEach(l=>{
      ctx.beginPath();
      ctx.moveTo(0,H()*l.y);
      for(let x=0;x<=W();x+=4){
        const y = H()*l.y + Math.sin(x*l.freq + t*l.speed*1000)*l.amp + Math.sin(x*l.freq*2.3 + t*l.speed*500)*l.amp*0.4;
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W(),H()); ctx.lineTo(0,H()); ctx.closePath();
      ctx.fillStyle = l.color; ctx.fill();
      // glow line
      ctx.beginPath();
      for(let x=0;x<=W();x+=4){
        const y = H()*l.y + Math.sin(x*l.freq + t*l.speed*1000)*l.amp + Math.sin(x*l.freq*2.3 + t*l.speed*500)*l.amp*0.4;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = l.color.replace(/[\d.]+\)$/,'0.5)'); ctx.lineWidth=2; ctx.shadowBlur=20; ctx.shadowColor=l.color; ctx.stroke(); ctx.shadowBlur=0;
    });
  }

  function draw(dt,t){
    drawAurora(t);
    const th = THEMES[theme];
    const camX = player.x - W()*0.22;
    // walls
    for(const w of walls){
      const x0 = w.x - camX;
      // top wall
      ctx.beginPath();
      ctx.moveTo(x0,0);
      for(let i=0;i<=w.w;i+=4){ ctx.lineTo(x0+i, wallY(w,w.x+i,true)); }
      ctx.lineTo(x0+w.w,0); ctx.closePath();
      ctx.fillStyle = 'rgba(15,18,32,0.85)'; ctx.fill();
      // top edge glow
      ctx.beginPath();
      for(let i=0;i<=w.w;i+=4){ const y=wallY(w,w.x+i,true); if(i===0) ctx.moveTo(x0+i,y); else ctx.lineTo(x0+i,y);}
      ctx.strokeStyle = th.wall; ctx.lineWidth=2; ctx.shadowBlur=12; ctx.shadowColor=th.wall; ctx.stroke(); ctx.shadowBlur=0;
      // bottom wall
      ctx.beginPath();
      ctx.moveTo(x0,H());
      for(let i=0;i<=w.w;i+=4){ ctx.lineTo(x0+i, wallY(w,w.x+i,false)); }
      ctx.lineTo(x0+w.w,H()); ctx.closePath();
      ctx.fillStyle='rgba(15,18,32,0.85)'; ctx.fill();
      ctx.beginPath();
      for(let i=0;i<=w.w;i+=4){ const y=wallY(w,w.x+i,false); if(i===0) ctx.moveTo(x0+i,y); else ctx.lineTo(x0+i,y);}
      ctx.strokeStyle = th.wall; ctx.lineWidth=2; ctx.shadowBlur=12; ctx.shadowColor=th.wall; ctx.stroke(); ctx.shadowBlur=0;
    }
    // spikes
    for(const s of spikes){
      const sx = s.x - camX;
      ctx.save();
      ctx.shadowBlur=14; ctx.shadowColor=th.spike;
      ctx.fillStyle = th.spike;
      ctx.beginPath();
      if(s.side==='bottom'){
        ctx.moveTo(sx, s.y); ctx.lineTo(sx+s.w/2, s.y-s.h); ctx.lineTo(sx+s.w, s.y);
      } else if(s.side==='top'){
        ctx.moveTo(sx, s.y); ctx.lineTo(sx+s.w/2, s.y+s.h); ctx.lineTo(sx+s.w, s.y);
      } else {
        ctx.moveTo(sx+s.w/2, s.y-s.h); ctx.lineTo(sx+s.w, s.y); ctx.lineTo(sx+s.w/2, s.y+s.h); ctx.lineTo(sx, s.y);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // trail
    const px = player.x - camX, py = player.y;
    if(trail==='solid' || trail==='fade'){
      ctx.save();
      for(let i=0;i<trailPts.length-1;i++){
        const a = trailPts[i], b = trailPts[i+1];
        const alpha = trail==='fade' ? (1 - i/trailPts.length) : 0.7;
        const g = ctx.createLinearGradient(a.x-camX, a.y, b.x-camX, b.y);
        g.addColorStop(0, hexA(th.trail1, alpha));
        g.addColorStop(1, hexA(th.trail2, alpha*0.6));
        ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.shadowBlur=8; ctx.shadowColor=th.trail1;
        ctx.beginPath(); ctx.moveTo(a.x-camX,a.y); ctx.lineTo(b.x-camX,b.y); ctx.stroke();
      }
      ctx.restore();
    }
    // particles
    for(const p of particles){
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.fillStyle = th.trail2; ctx.shadowBlur=6; ctx.shadowColor=th.trail2;
      ctx.beginPath(); ctx.arc(p.x-camX, p.y, p.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // player
    ctx.save();
    ctx.shadowBlur=20; ctx.shadowColor=th.player;
    ctx.fillStyle = th.player;
    ctx.translate(px,py);
    if(icon==='tri'){
      ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,-10); ctx.lineTo(-10,10); ctx.closePath(); ctx.fill();
    } else if(icon==='dia'){
      ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(12,0); ctx.lineTo(0,12); ctx.lineTo(-12,0); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function hexA(hex,a){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  let raf;
  function loop(t){
    const dt = Math.min(0.033, (t-lastT)/1000); lastT = t;
    update(dt);
    draw(dt,t);
    raf = requestAnimationFrame(loop);
  }

  function startPlay(){
    document.getElementById('start').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
    reset();
    state='play';
    lastT = performance.now();
  }
  document.getElementById('play').onclick = startPlay;
  document.getElementById('retry').onclick = startPlay;

  // input
  function down(){ if(state==='play') holding=true; }
  function up(){ if(state==='play') holding=false; }
  addEventListener('mousedown', down);
  addEventListener('mouseup', up);
  addEventListener('touchstart', e=>{e.preventDefault();down();},{passive:false});
  addEventListener('touchend', e=>{e.preventDefault();up();},{passive:false});
  addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); down(); } if(state!=='play' && e.code==='Space') startPlay();});
  addEventListener('keyup', e=>{ if(e.code==='Space') up(); });

  // panel
  function wire(id, setter){
    document.getElementById(id).querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ document.getElementById(id).querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); setter(b.dataset.v); };
    });
  }
  wire('icons', v=>icon=v);
  wire('themes', v=>theme=v);
  wire('trails', v=>trail=v);

  // init best
  document.getElementById('best').textContent = 'best '+best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
